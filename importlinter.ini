[importlinter]
root_packages =
    voiceiq

[importlinter:contract:domain_is_pure]
name = Domain layer must be pure Python
type = forbidden
source_modules =
    voiceiq.service.transcript.domain
forbidden_modules =
    fastapi
    sqlalchemy
    asyncpg
    redis
    aiokafka
    nats
    httpx
    boto3
    grpc
    pydantic

[importlinter:contract:bff_no_infra]
name = BFF must not import infra directly
type = forbidden
source_modules =
    voiceiq.bff
forbidden_modules =
    voiceiq.service.transcript.infra
    voiceiq.infrastructure.db

[importlinter:contract:handlers_use_ports]
name = Handlers depend on ports not concrete infra
type = forbidden
source_modules =
    voiceiq.service.transcript.commands
    voiceiq.service.transcript.queries
forbidden_modules =
    voiceiq.service.transcript.infra
    voiceiq.infrastructure

[importlinter:contract:shared_no_service]
name = Shared must not depend on service or bff
type = forbidden
source_modules =
    voiceiq.shared
forbidden_modules =
    voiceiq.service
    voiceiq.bff
